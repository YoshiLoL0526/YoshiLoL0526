<svg xmlns="http://www.w3.org/2000/svg" width="420" height="180" viewBox="0 0 420 180" role="img" aria-label="Estadísticas de GitHub">
  <title>Estadísticas de GitHub</title>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 17px; font-weight: 600; fill: #0f6e74; }
    .label { font-size: 13.5px; fill: #59636e; }
    .value { font-size: 14px; font-weight: 600; fill: #1f2328; }
    .fade { opacity: 0; animation: fade .5s ease-out forwards; }
    @keyframes fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } }
  </style>
  <rect x="0.5" y="0.5" width="419" height="179" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="36" class="title">Estadísticas de GitHub</text>
  <g class="fade" style="animation-delay:0ms"><circle cx="28" cy="61.5" r="3.5" fill="#2c9c9a"/><text x="42" y="66" class="label">Estrellas recibidas</text><text x="396" y="66" class="value" text-anchor="end">6</text></g>
  <g class="fade" style="animation-delay:80ms"><circle cx="28" cy="85.5" r="3.5" fill="#2c9c9a"/><text x="42" y="90" class="label">Contribuciones (12 meses)</text><text x="396" y="90" class="value" text-anchor="end">877</text></g>
  <g class="fade" style="animation-delay:160ms"><circle cx="28" cy="109.5" r="3.5" fill="#2c9c9a"/><text x="42" y="114" class="label">Pull requests</text><text x="396" y="114" class="value" text-anchor="end">1</text></g>
  <g class="fade" style="animation-delay:240ms"><circle cx="28" cy="133.5" r="3.5" fill="#2c9c9a"/><text x="42" y="138" class="label">Issues</text><text x="396" y="138" class="value" text-anchor="end">2</text></g>
  <g class="fade" style="animation-delay:320ms"><circle cx="28" cy="157.5" r="3.5" fill="#2c9c9a"/><text x="42" y="162" class="label">Repos públicos</text><text x="396" y="162" class="value" text-anchor="end">22</text></g>
</svg>
